name: I4H Recovery Builder Self-Test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/i4h_recovery_builder_selftest.yml'
      - 'handoff/20260909/P07_I4H_PHYSICAL_RECOVERY_BUILDER_R1.py'
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile
        run: python -m py_compile handoff/20260909/P07_I4H_PHYSICAL_RECOVERY_BUILDER_R1.py
      - name: Self test
        run: python handoff/20260909/P07_I4H_PHYSICAL_RECOVERY_BUILDER_R1.py --self-test
      - name: Boundary
        run: echo 'Builder self-test only; no Sync R6 bytes, no R2 physical qualification, no authority promotion.'
