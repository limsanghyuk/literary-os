name: I4K5R4A Attempt2 Late Treatment R4 Materialize
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  materialize:
    if: contains(github.event.head_commit.message, 'Materialize late Treatment R4 files')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python handoff/20260911/P07_I4K5R4A_ATTEMPT2_LATE_R4_MATERIALIZER.py
      - name: Commit R4 segments
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add handoff/20260911/i4k5r4a_attempt2/treatment_late_superseding_r4/
          git commit -m "Materialize R4A Attempt2 late Treatment R4 segments"
          git push origin HEAD:main