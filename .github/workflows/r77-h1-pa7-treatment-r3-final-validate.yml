name: R77-H1 PA7 Treatment R3 Final Validate
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    if: contains(github.event.head_commit.message, 'Run PA7 Treatment R3 final validation')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate final Treatment
        run: python research/interventions/20260926/r77_h1_pa7_treatment_r3_final_build_validate.py
      - name: Commit final Treatment evidence
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/interventions/20260926/r77_h1_pa7_treatment_r1/R77_H1_PA7_TREATMENT_R3_FINAL_SCREENPLAY.txt
          git add research/interventions/20260926/r77_h1_pa7_treatment_r1/R77_H1_PA7_TREATMENT_R3_FINAL_MECHANICAL_RESULT.json
          git commit -m 'Seal PA7 Treatment R3 final matched candidate' || exit 0
          git pull --rebase origin main
          git push
