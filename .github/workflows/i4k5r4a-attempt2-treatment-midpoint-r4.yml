name: I4K5R4A Attempt2 Treatment midpoint R4
on:
  push:
    branches: [i4k5r4a-attempt2-treatment-midpoint-r4]
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen source commit is ancestor
        run: git merge-base --is-ancestor fd2aff66f005fc6ba5f2a9fd13aa207b9fb89bd7 HEAD
      - name: Run Treatment R4 midpoint gate
        run: python handoff/20260911/I4K5R4A_ATTEMPT2_TREATMENT_MIDPOINT_R4_RUNNER_R1.py
      - uses: actions/upload-artifact@v4
        with:
          name: i4k5r4a-attempt2-treatment-midpoint-r4
          path: /tmp/i4k5r4a_attempt2_treatment_midpoint_r4_metrics.json