name: I4K5R4A G7 Preflight R1
on:
  push:
    branches: [main]
jobs:
  preflight:
    if: contains(github.event.head_commit.message, 'Run R4A G7 duplicate-score provider preflight')
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python handoff/20260912/P07_I4K5R4A_G7_DUPLICATE_SCORE_PROVIDER_PREFLIGHT_RUNNER_R1.py
      - uses: actions/upload-artifact@v4
        with:
          name: i4k5r4a-g7-preflight-r1
          path: /tmp/i4k5r4a_g7_preflight_r1.json
