name: R77-H1 PA6 External 3-Judge Dispatch Build R1
on:
  push:
    branches: [main]
jobs:
  build:
    if: contains(github.event.head_commit.message, 'Build PA6 external 3-judge dispatch R1')
    runs-on: ubuntu-latest
    env:
      MAPPING_SECRET: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build blind dispatch
        run: python research/interventions/20260925/r77_h1_pa6_external_dispatch_build_r1.py
      - uses: actions/upload-artifact@v4
        with:
          name: PA6-J01-BLIND
          path: pa6_external_dispatch/J01
      - uses: actions/upload-artifact@v4
        with:
          name: PA6-J02-BLIND
          path: pa6_external_dispatch/J02
      - uses: actions/upload-artifact@v4
        with:
          name: PA6-J03-BLIND
          path: pa6_external_dispatch/J03
      - uses: actions/upload-artifact@v4
        with:
          name: PA6-COORDINATOR-MAPPING
          path: |
            pa6_external_dispatch/COORDINATOR_MAPPING_R1.json
            pa6_external_dispatch/DISPATCH_BUILD_RECEIPT_R1.json
