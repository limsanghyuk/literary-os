name: I4K5R3 Attempt2 final Control scale measurement
on:
  push:
    branches: [i4k5r3-a2-control-final-measure]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python handoff/20260911/I4K5R3_A2_FINAL_CONTROL_MEASURE_R1.py
      - uses: actions/upload-artifact@v4
        with:
          name: i4k5r3-a2-final-control-scale-r1
          path: _i4k5r3_a2fc/metrics.json
