name: R77-H1 PA7 Control R2 Underlength Repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    if: contains(github.event.head_commit.message, 'Build PA7 Control R2 final')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate
        run: python research/interventions/20260926/r77_h1_pa7_control_r2_build_validate.py
      - name: Commit sealed Control R2
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/interventions/20260926/r77_h1_pa7_control_r1/R77_H1_PA7_CONTROL_R2_FULL_SCREENPLAY.txt research/interventions/20260926/r77_h1_pa7_control_r1/R77_H1_PA7_CONTROL_R2_MECHANICAL_RESULT.json
          git commit -m 'Seal PA7 Control R2 final candidate' || exit 0
          git pull --rebase origin main
          git push
