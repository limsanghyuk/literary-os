name: R77-H1 PA7 Treatment R2 A-D Validate
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    if: contains(github.event.head_commit.message, 'Run PA7 Treatment R2 A-D validation')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate Treatment R2
        run: python research/interventions/20260926/r77_h1_pa7_treatment_r2_build_validate.py || true
      - name: Commit Treatment R2 evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/interventions/20260926/r77_h1_pa7_treatment_r1/R77_H1_PA7_TREATMENT_R2_FULL_SCREENPLAY.txt
          git add research/interventions/20260926/r77_h1_pa7_treatment_r1/R77_H1_PA7_TREATMENT_R2_MECHANICAL_RESULT.json
          git commit -m 'Seal PA7 Treatment R2 A-D result' || exit 0
          git pull --rebase origin main
          git push
