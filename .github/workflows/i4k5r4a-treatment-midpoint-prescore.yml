name: I4K5R4A Treatment midpoint prescore
on:
  push:
    branches: [i4k5r4a-treatment-midpoint-prescore]
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen source commit is ancestor
        run: git merge-base --is-ancestor 24ce709fe39f2d236c6f5ed7cd721fa0d846ee59 HEAD
      - name: Run Treatment midpoint prescore gate
        run: python handoff/20260911/I4K5R4A_TREATMENT_MIDPOINT_PRESCORE_RUNNER_R1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i4k5r4a-treatment-midpoint-prescore-r1
          path: i4k5r4a_treatment_midpoint_prescore_r1.json
