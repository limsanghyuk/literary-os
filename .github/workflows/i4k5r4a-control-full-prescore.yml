name: I4K5R4A Control full prescore debug gate
on:
  push:
    branches: [i4k5r4a-control-full-prescore]
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen source commit is ancestor
        run: git merge-base --is-ancestor 74e1198c09744d2b27ca238f51e0a4e521afd099 HEAD
      - name: Run Control full prescore debug gate
        run: python handoff/20260911/I4K5R4A_CONTROL_FULL_PRESCORE_RUNNER_R1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i4k5r4a-control-full-prescore-r1
          path: i4k5r4a_control_full_prescore_r1.json
