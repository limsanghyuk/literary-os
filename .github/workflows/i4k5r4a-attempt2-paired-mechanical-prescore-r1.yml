name: I4K5R4A Attempt2 Paired Mechanical Prescore R1
on:
  push:
    branches: [main]
jobs:
  measure:
    if: contains(github.event.head_commit.message, 'Run paired mechanical prescore for R4A Attempt2')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run paired mechanical prescore
        run: python handoff/20260911/P07_I4K5R4A_ATTEMPT2_PAIRED_MECHANICAL_PRESCORE_RUNNER_R1.py
      - uses: actions/upload-artifact@v4
        with:
          name: i4k5r4a-attempt2-paired-mechanical-prescore-r1
          path: /tmp/i4k5r4a_attempt2_paired_mechanical_prescore_r1.json