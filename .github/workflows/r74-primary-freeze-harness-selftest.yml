name: R74 Primary Freeze Harness Selftest
on:
  pull_request:
    paths:
      - 'research/interventions/20260922/R74_PRIMARY_FREEZE_HARNESS_TRIGGER.txt'
      - 'research/interventions/20260922/r74_primary_materialize_freeze_r1.py'
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run R74 freeze harness self-test
        run: python research/interventions/20260922/r74_primary_materialize_freeze_r1.py --selftest
