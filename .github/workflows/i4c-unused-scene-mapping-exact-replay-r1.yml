name: I4C Unused Scene Mapping Exact Replay R1
on:
  push:
    branches: [main]
jobs:
  replay:
    if: contains(github.event.head_commit.message, 'Run I4C exact mapping replay')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replay exact sealed mapping bytes
        run: |
          set -euo pipefail
          python handoff/20260912/I4C_UNUSED_SCENE_MAPPING_EXACT_REPLAY_R1.py
          cat /tmp/I4C_UNUSED_SCENE_MAPPING_EXACT_REPLAY_RECEIPT_R1.json
      - uses: actions/upload-artifact@v4
        with:
          name: i4c-unused-scene-mapping-exact-replay-r1
          path: |
            /tmp/I4C_UNUSED_SCENE_MAPPING_EXACT_REPLAY_RECEIPT_R1.json
            /tmp/I4C_UNUSED_SCENE_MIXED_CRAFT_MAPPING_SECRET_REPLAY_R1.json
