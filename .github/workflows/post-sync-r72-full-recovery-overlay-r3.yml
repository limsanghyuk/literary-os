name: Post SYNC-R72 Full Recovery Overlay R3
on:
  push:
    paths:
      - 'research/interventions/20260925/build_post_sync_r72_full_recovery_overlay_r3.py'
      - '.github/workflows/post-sync-r72-full-recovery-overlay-r3.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and audit full recovery overlay R3
        run: python research/interventions/20260925/build_post_sync_r72_full_recovery_overlay_r3.py | tee full_recovery_overlay_r3_build_result.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: post-sync-r72-full-recovery-overlay-r3
          path: |
            research/interventions/20260925/POST_SYNC_R72_FULL_RECOVERY_OVERLAY_R3.zip
            research/interventions/20260925/POST_SYNC_R72_FULL_RECOVERY_OVERLAY_MANIFEST_R3.json
            full_recovery_overlay_r3_build_result.jsonl
