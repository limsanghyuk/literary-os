name: R77-H1 Provider Analog Full Pipeline Pretest R2
on:
  push:
    branches: [main]
jobs:
  pretest:
    if: contains(github.event.head_commit.message, 'Run R77-H1 PA full-pipeline pretest R2')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run identical frozen suite against R2 repair
        run: python research/interventions/20260925/r77_h1_pa_full_pipeline_pretest_r2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r77-h1-pa-full-pipeline-pretest-r2
          path: r77_h1_pa_r2_result.json
